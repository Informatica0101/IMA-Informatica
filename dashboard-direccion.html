<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Dashboard de Dirección - New Generation Christian Academy</title>
    <link rel="icon" type="image/png" href="imagenes/new-generation-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=23">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="font-inter antialiased text-gray-900 bg-gray-50 min-h-screen flex flex-col">
    <!-- ENCABEZADO INSTITUCIONAL -->
    <header id="main-header" class="fixed w-full z-[100] transition-all duration-300 bg-white border-b border-gray-100">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center h-16 md:h-20">
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="imagenes/new-generation-logo.png" alt="Logo" class="w-10 h-10 object-contain">
                    <div>
                        <h1 class="text-sm md:text-xl font-black text-gray-900 uppercase leading-none">New Generation</h1>
                        <p class="text-[9px] md:text-[11px] font-bold text-blue-600 uppercase mt-1">Dirección General & Aprobaciones</p>
                    </div>
                </a>
            </div>
            <div class="flex items-center gap-3">
                <nav class="hidden md:flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
                    <a href="index.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Inicio</a>
                    <a href="dashboard-contabilidad.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Contabilidad</a>
                    <a href="dashboard-direccion.html" class="px-3 py-2 text-blue-600 font-black">Dirección</a>
                    <a href="dashboard-secretaria.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Secretaría</a>
                    <a href="dashboard-tienda.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Tienda</a>
                    <a href="dashboard-cafeteria.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Cafetería</a>
                </nav>
                <button id="btn-user-management-admin" class="p-2 text-blue-600 hover:text-blue-800 rounded-xl hover:bg-blue-50 text-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500" title="Gestión Administrativa de Usuarios y Permisos" aria-label="Gestión de Usuarios">
                    <i class="fa-solid fa-users-gear"></i>
                </button>
                <button id="btn-security-compliance-dashboard" class="p-2 text-red-600 hover:text-red-800 rounded-xl hover:bg-red-50 text-lg transition-all focus:outline-none focus:ring-2 focus:ring-red-500" title="Panel de Seguridad, Auditoría y Cumplimiento" aria-label="Panel de Seguridad">
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
                <button id="btn-global-dashboard-settings" class="p-2 text-slate-600 hover:text-slate-900 rounded-xl hover:bg-slate-100 text-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500" title="Opciones y Configuración del Dashboard" aria-label="Opciones y Configuración">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="mt-[5.5rem] pb-12 flex-grow container mx-auto px-4 md:px-8 max-w-7xl">
        <div class="mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-white p-6 rounded-[2.5rem] border border-gray-100 shadow-sm">
            <div>
                <span class="px-3 py-1 bg-purple-50 text-purple-600 rounded-full text-[10px] font-black uppercase tracking-widest">Panel de Autoridad</span>
                <h2 class="text-2xl md:text-3xl font-black text-gray-900 uppercase tracking-tighter mt-1">Aprobación de Becas & Descuentos</h2>
            </div>
            <div id="direccion-metrics-summary" class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-[9px] font-black text-gray-400 uppercase">Solicitudes Pendientes</p>
                    <p class="text-xl font-black text-purple-600" id="pending-approvals-count">0</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-[2.5rem] border border-gray-100 shadow-sm">
            <h3 class="text-lg font-black text-gray-800 uppercase mb-4">Bandeja de Aprobaciones de Dirección</h3>
            <div id="approvals-list-container" class="space-y-4">
                <div class="text-center py-8 text-gray-400 font-bold text-xs uppercase">No hay solicitudes pendientes de autorización en este momento.</div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=23"></script>
    <script src="js/api.js?v=23"></script>
    <script src="js/ui-common.js?v=23"></script>
    <script>
        // [TAREA-F4-P2-03] [Fase 4: Gestión de Usuarios] - Vinculación de los botones de gestión de usuarios y seguridad
        document.addEventListener("DOMContentLoaded", function() {
            var usrBtn = document.getElementById("btn-user-management-admin");
            if (usrBtn) {
                usrBtn.addEventListener("click", function() {
                    if (typeof window.openUserManagementAdministrationModal === "function") {
                        window.openUserManagementAdministrationModal(usrBtn);
                    }
                });
            }

            var secBtn = document.getElementById("btn-security-compliance-dashboard");
            if (secBtn) {
                secBtn.addEventListener("click", function() {
                    if (typeof window.openSecurityAndComplianceDashboardModal === "function") {
                        window.openSecurityAndComplianceDashboardModal(secBtn);
                    }
                });
            }
        });
    </script>
</body>
</html>
