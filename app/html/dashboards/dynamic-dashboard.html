<!DOCTYPE html>
<!-- [TAREA-AD-01] [Anexo Tareas: Dashboards Dinámicos] - Interfaz de dashboard adaptable por rol, responsabilidad y permisos -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dinámico Adaptable - Plataforma Educativa</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center no-print">
        <div class="flex items-center gap-3">
            <img src="../../../imagenes/new-generation-logo.png" alt="Logo" class="h-10 w-auto" />
            <div>
                <h1 id="dynamic-dashboard-title" class="font-bold text-sm">Dashboard Dinámico Adaptable</h1>
                <p id="dynamic-dashboard-subtitle" class="text-[10px] text-indigo-200">Plataforma Integral de Gestión Educativa</p>
            </div>
        </div>
        <div class="flex items-center gap-3 text-xs">
            <span id="dynamic-user-role-badge" class="px-2.5 py-1 bg-indigo-800 text-indigo-100 rounded-full font-bold">Cargando rol...</span>
            <button onclick="window.logout()" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-sign-out-alt mr-1"></i> Salir
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
        <div id="dynamic-dashboard-modules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center py-12 text-slate-400 font-bold text-xs uppercase tracking-wider col-span-3">
                <i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl mb-2"></i>
                <p>Cargando módulos y herramientas autorizadas...</p>
            </div>
        </div>
    </main>

    <script src="../../../js/config.js"></script>
    <script src="../../../js/persistence.js"></script>
    <script src="../../../js/api.js"></script>
    <script src="../../../js/ui-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.loadDynamicDashboard === 'function') {
                window.loadDynamicDashboard();
            }
        });
    </script>
</body>
</html>
