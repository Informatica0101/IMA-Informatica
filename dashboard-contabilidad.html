<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Dashboard de Contabilidad - New Generation Christian Academy</title>
    <link rel="icon" type="image/png" href="imagenes/new-generation-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=23">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="font-inter antialiased text-gray-900 bg-gray-50 min-h-screen flex flex-col">
    <!-- ENCABEZADO INSTITUCIONAL -->
    <header id="main-header" class="fixed w-full z-[100] transition-all duration-300 bg-white border-b border-gray-100">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center h-16 md:h-20">
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="imagenes/new-generation-logo.png" alt="Logo" class="w-10 h-10 object-contain">
                    <div>
                        <h1 class="text-sm md:text-xl font-black text-gray-900 uppercase leading-none">New Generation</h1>
                        <p class="text-[9px] md:text-[11px] font-bold text-blue-600 uppercase mt-1">Gestión Contable & Financiera</p>
                    </div>
                </a>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
                <a href="index.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Inicio</a>
                <a href="dashboard-contabilidad.html" class="px-3 py-2 text-blue-600 font-black">Contabilidad</a>
                <a href="dashboard-direccion.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Dirección</a>
                <a href="dashboard-tienda.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Tienda</a>
                <a href="dashboard-cafeteria.html" class="px-3 py-2 text-gray-600 hover:text-blue-600">Cafetería</a>
            </nav>
        </div>
    </header>

    <main class="mt-[5.5rem] pb-12 flex-grow container mx-auto px-4 md:px-8 max-w-7xl">
        <div class="mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-white p-6 rounded-[2.5rem] border border-gray-100 shadow-sm">
            <div>
                <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[10px] font-black uppercase tracking-widest">Área Financiera</span>
                <h2 class="text-2xl md:text-3xl font-black text-gray-900 uppercase tracking-tighter mt-1">Gestión Contable & Descuentos</h2>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-nueva-regla-descuento" class="px-5 py-2.5 bg-blue-600 text-white rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-md">
                    + Crear Descuento / Beca
                </button>
            </div>
        </div>

        <!-- Mapeo de Submenús -->
        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3 mb-8">
            <button onclick="switchTab('resumen')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-chart-line text-blue-600 text-lg"></i> Resumen
            </button>
            <button onclick="switchTab('comprobantes')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-receipt text-amber-600 text-lg"></i> Comprobantes
            </button>
            <button onclick="switchTab('diario')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-book text-emerald-600 text-lg"></i> Libro Diario
            </button>
            <button onclick="switchTab('presupuestos')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-calculator text-indigo-600 text-lg"></i> Presupuestos
            </button>
            <button onclick="switchTab('descuentos')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-tags text-purple-600 text-lg"></i> Descuentos/Becas
            </button>
            <button onclick="switchTab('cobrar')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-file-invoice-dollar text-emerald-600 text-lg"></i> Cuentas x Cobrar
            </button>
            <button onclick="switchTab('reportes')" class="p-4 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 font-bold text-xs uppercase text-gray-700 shadow-sm flex flex-col items-center gap-2">
                <i class="fas fa-print text-teal-600 text-lg"></i> Informes
            </button>
        </div>

        <div id="tab-content" class="bg-white p-6 md:p-8 rounded-[2.5rem] border border-gray-100 shadow-sm">
            <h3 class="text-lg font-black text-gray-800 uppercase mb-4">Módulo de Contabilidad y Control Financiero</h3>
            <div id="contabilidad-panel-container" class="space-y-4">
                <div class="text-center py-8 text-gray-400 font-bold text-xs uppercase">Cargando información financiera...</div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=23"></script>
    <script src="js/api.js?v=23"></script>
    <script src="js/ui-common.js?v=23"></script>
    <script>
        function switchTab(tab) {
            console.log("Cambiando a pestaña contable:", tab);
        }
    </script>
</body>
</html>
